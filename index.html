<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống 7 Rotor Bậc Thang</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 1.4rem;
            text-align: center;
            color: #00ffcc;
        }

        .countdown {
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #aaa;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .rotor-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        /* Khi rotor đang hoạt động */
        .rotor-box.active-rotor {
            border-color: #00ffcc;
            background: #1a2925;
        }

        .rotor-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #bbb;
        }

        .rotor-status {
            font-size: 1.3rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 8px;
            min-width: 100px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Trạng thái chưa chạy (Chờ) */
        .status-cho {
            background-color: #444;
            color: #888;
        }

        /* Trạng thái Lớn / Nhỏ khi đang chạy */
        .status-lon {
            background-color: #ff3366;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .status-nho {
            background-color: #33ccff;
            color: #121212;
            box-shadow: 0 0 10px rgba(51, 204, 255, 0.5);
        }

        .btn-trigger {
            margin-top: 25px;
            padding: 14px 28px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            max-width: 360px;
        }
        .btn-trigger:active {
            background: #00b38f;
        }
    </style>
</head>
<body>

    <h2>HỆ THỐNG ROTOR BẬC THANG</h2>
    <div class="countdown">Bước tiếp theo sau: <span id="timer">30</span> giây</div>

    <div class="container">
        <div class="rotor-box" id="box-1">
            <div class="rotor-name">Rotor 1</div>
            <div class="rotor-status" id="status-1">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-2">
            <div class="rotor-name">Rotor 2</div>
            <div class="rotor-status" id="status-2">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-3">
            <div class="rotor-name">Rotor 3</div>
            <div class="rotor-status" id="status-3">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-4">
            <div class="rotor-name">Rotor 4</div>
            <div class="rotor-status" id="status-4">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-5">
            <div class="rotor-name">Rotor 5</div>
            <div class="rotor-status" id="status-5">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-6">
            <div class="rotor-name">Rotor 6</div>
            <div class="rotor-status" id="status-6">Chờ...</div>
        </div>

        <div class="rotor-box" id="box-7">
            <div class="rotor-name">Rotor 7</div>
            <div class="rotor-status" id="status-7">Chờ...</div>
        </div>
    </div>

    <button class="btn-trigger" onclick="nextStep()">Kích Hoạt Bước Tiếp Theo Ngay</button>

    <script>
        // Cấu hình dữ liệu xoay vòng (5 bước) cho từng rotor
        const rotorData = {
            1: ["Lớn", "Lớn", "Nhỏ", "Lớn", "Lớn"],
            2: ["Nhỏ", "Lớn", "Nhỏ", "Lớn", "Lớn"],
            3: ["Nhỏ", "Lớn", "Lớn", "Nhỏ", "Nhỏ"],
            4: ["Lớn", "Nhỏ", "Lớn", "Lớn", "Nhỏ"],
            5: ["Lớn", "Lớn", "Lớn", "Nhỏ", "Nhỏ"],
            6: ["Nhỏ", "Lớn", "Nhỏ", "Nhỏ", "Lớn"],
            7: ["Lớn", "Nhỏ", "Lớn", "Nhỏ", "Lớn"]
        };

        // Mảng lưu trữ bước hiện tại của từng rotor (Bắt đầu từ -1 nghĩa là chưa chạy)
        let rotorSteps = { 1: -1, 2: -1, 3: -1, 4: -1, 5: -1, 6: -1, 7: -1 };
        
        // Biến kiểm soát việc kích hoạt rotor mới (Bắt đầu kích hoạt từ Rotor 1)
        let nextRotorToActivate = 1; 
        
        let timeLeft = 30;
        const timerDisplay = document.getElementById('timer');

        // Hàm xử lý logic chạy bậc thang
        function nextStep() {
            // 1. Kích hoạt thêm 1 rotor mới nếu chưa kích hoạt hết 7 cái
            if (nextRotorToActivate <= 7) {
                rotorSteps[nextRotorToActivate] = 0; // Đặt bước đầu tiên (Index 0) cho rotor mới
                nextRotorToActivate++;
            }

            // 2. Cập nhật và tiến bước cho các rotor ĐANG CHẠY
            for (let i = 1; i <= 7; i++) {
                const statusBox = document.getElementById(`status-${i}`);
                const boxContainer = document.getElementById(`box-${i}`);
                
                // Nếu rotor này đã được kích hoạt (bước >= 0)
                if (rotorSteps[i] >= 0) {
                    // Lấy chữ "Lớn" hoặc "Nhỏ" dựa trên bước hiện tại
                    const textValue = rotorData[i][rotorSteps[i]];
                    
                    statusBox.textContent = textValue;
                    boxContainer.classList.add('active-rotor'); // Làm nổi bật viền khung đang chạy

                    if (textValue === "Lớn") {
                        statusBox.className = "rotor-status status-lon";
                    } else {
                        statusBox.className = "rotor-status status-nho";
                    }

                    // Tăng bước của rotor này lên để chuẩn bị cho 30s kế tiếp (vòng tuần hoàn 0 -> 4)
                    rotorSteps[i] = (rotorSteps[i] + 1) % 5;
                } else {
                    // Nếu chưa đến lượt chạy
                    statusBox.textContent = "Chờ...";
                    statusBox.className = "rotor-status status-cho";
                    boxContainer.classList.remove('active-rotor');
                }
            }
        }

        // Chạy ngay lập tức khi mở ứng dụng (Rotor 1 sẽ chạy trước)
        nextStep();

        // Bộ đếm ngược 30 giây tự động tự chạy
        setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;

            if (timeLeft <= 0) {
                nextStep();
                timeLeft = 30; // Reset thời gian
            }
        }, 1000);
    </script>
</body>
</html>
